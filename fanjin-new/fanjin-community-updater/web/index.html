<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>繁境 · 版本与更新</title><link rel="stylesheet" href="style.css"></head><body>
<main><a class="back" href="/">← 返回繁境</a><header><span class="mark">FJ</span><div><h1>版本与更新</h1><p>保留你的配置、素材和创作任务。</p></div></header>
<section><div class="versions"><div><small>当前版本</small><strong id="current">读取中</strong></div><div><small>可用版本</small><strong id="available">—</strong></div></div>
<p id="progress" role="status" aria-live="polite">正在读取更新状态…</p><pre id="notes"></pre><p id="error" role="alert"></p>
<div class="actions"><button id="check">检查更新</button><button id="apply" class="primary" disabled>立即更新</button><button id="recover" hidden>重试恢复原版本</button></div>
<p class="hint">下载期间可继续使用。切换时会短暂暂停服务，完成后自动恢复。更新记录会在关闭页面后保留。</p></section></main><script type="module" src="app.js"></script></body></html>
